ops:
  - id: sgemm
    description: |
      single-precision GEMM, it uses standard FP32 floating point.
      This is a simple wrapper of the existing BLAS `gemm` operator.
    for:
      - sgemm
    labels:
      - sgemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dgemm
    description: |
      Double-precision GEMM, based on FP64 format.
      This is a simple wrapper of the existing BLAS float64 `gemm` operator.
    for:
      - dgemm
    labels:
      - dgemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cgemm
    description: |
      Single-precision complex GEMM, based on complex64 format.
      This is a simple wrapper of the existing BLAS complex64 `gemm` operator.
    for:
      - cgemm
    labels:
      - cgemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zgemm
    description: |
      Double-precision complex GEMM, based on complex128 format.
      This is a simple wrapper of the existing BLAS complex128 `gemm` operator.
    for:
      - zgemm
    labels:
      - zgemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: hgemm
    description: |
      half-precision GEMM, based on FP16 format.
      This is a simple wrapper of the existing BLAS float16 `gemm` operator.
    for:
      - hgemm
    labels:
      - hgemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: bfgemm
    description: |
      Refers to GEMM with BF16 data type.
      This is a simple wrapper of the existing BLAS bfloat16`gemm` operator.
    for:
      - bfgemm
    labels:
      - bfgemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: group_bfgemm
    description: |
      Refers to GROUP_GEMM with BF16 data type.
      This is a simple wrapper of the existing BLAS bfloat16 `group_gemm` operator.
    for:
      - group_bfgemm
    labels:
      - gemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: group_hgemm
    description: |
      Refers to GROUP_GEMM with FP16 data type.
      This is a simple wrapper of the existing BLAS float16 `group_gemm` operator.
    for:
      - group_hgemm
    labels:
      - gemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: group_tf32gemm
    description: |
      Refers to GROUP_GEMM with TF32 data type.
      This is a simple wrapper of the existing BLAS tf32 `group_gemm` operator.
    for:
      - group_tf32gemm
    labels:
      - gemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: group_mm
    description: |
      Generic GROUP_GEMM operator.
      Dispatches a batch of GEMM problems with mixed shapes and dtypes.
    for:
      - group_mm
    labels:
      - gemm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: strmm
    description: |
      Single-precision BLAS Level 3 triangular matrix-matrix multiplication.
      Computes B = alpha * op(A) * B or B = alpha * B * op(A) for a float32 triangular matrix A.
    for:
      - strmm
    labels:
      - trmm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dtrmm
    description: |
      Double-precision BLAS Level 3 triangular matrix-matrix multiplication.
      Computes B = alpha * op(A) * B or B = alpha * B * op(A) for a float64 triangular matrix A.
    for:
      - dtrmm
    labels:
      - trmm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: ctrmm
    description: |
      Single-precision complex BLAS Level 3 triangular matrix-matrix multiplication.
      Computes B = alpha * op(A) * B or B = alpha * B * op(A) for a complex64 triangular matrix A.
    for:
      - ctrmm
    labels:
      - trmm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: ztrmm
    description: |
      Double-precision complex BLAS Level 3 triangular matrix-matrix multiplication.
      Computes B = alpha * op(A) * B or B = alpha * B * op(A) for a complex128 triangular matrix A.
    for:
      - ztrmm
    labels:
      - trmm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: isamax
    description: |
      Single-precision BLAS Level 1 index-of-maximum-absolute-value reduction.
      Returns the 1-based index of the float32 vector element with the largest absolute value.
    for:
      - isamax
    labels:
      - amax
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: idamax
    description: |
      Double-precision BLAS Level 1 index-of-maximum-absolute-value reduction.
      Returns the 1-based index of the float64 vector element with the largest absolute value.
    for:
      - idamax
    labels:
      - amax
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: icamax
    description: |
      Single-precision complex BLAS Level 1 index-of-maximum-absolute-value reduction.
      Returns the 1-based index of the complex64 element with the largest BLAS complex absolute value.
    for:
      - icamax
    labels:
      - amax
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: izamax
    description: |
      Double-precision complex BLAS Level 1 index-of-maximum-absolute-value reduction.
      Returns the 1-based index of the complex128 element with the largest BLAS complex absolute value.
    for:
      - izamax
    labels:
      - amax
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: isamin
    description: |
      Single-precision BLAS Level 1 index-of-minimum-absolute-value reduction.
      Returns the 1-based index of the float32 vector element with the smallest absolute value.
    for:
      - isamin
    labels:
      - amin
      - NoCPU
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: idamin
    description: |
      Double-precision BLAS Level 1 index-of-minimum-absolute-value reduction.
      Returns the 1-based index of the float64 vector element with the smallest absolute value.
    for:
      - idamin
    labels:
      - amin
      - NoCPU
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: icamin
    description: |
      Single-precision complex BLAS Level 1 index-of-minimum-absolute-value reduction.
      Returns the 1-based index of the complex64 element with the smallest BLAS complex absolute value.
    for:
      - icamin
    labels:
      - amin
      - NoCPU
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: izamin
    description: |
      Double-precision complex BLAS Level 1 index-of-minimum-absolute-value reduction.
      Returns the 1-based index of the complex128 element with the smallest BLAS complex absolute value.
    for:
      - izamin
    labels:
      - amin
      - NoCPU
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: sasum
    description: |
      Single-precision BLAS Level 1 absolute-sum reduction.
      Computes the sum of absolute values for a strided float32 vector.
    for:
      - sasum
    labels:
      - asum
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dasum
    description: |
      Double-precision BLAS Level 1 absolute-sum reduction.
      Computes the sum of absolute values for a strided float64 vector.
    for:
      - dasum
    labels:
      - asum
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: scasum
    description: |
      Single-precision complex BLAS Level 1 absolute-sum reduction.
      Computes the sum of abs(real(x[i])) + abs(imag(x[i])) for a strided complex64 vector.
    for:
      - scasum
    labels:
      - asum
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dzasum
    description: |
      Double-precision complex BLAS Level 1 absolute-sum reduction.
      Computes the sum of abs(real(x[i])) + abs(imag(x[i])) for a strided complex128 vector.
    for:
      - dzasum
    labels:
      - asum
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: saxpy
    description: |
      Single-precision BLAS Level 1 scaled vector addition.
      Updates y in place with y = alpha * x + y for strided float32 vectors.
    for:
      - saxpy
    labels:
      - axpy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: daxpy
    description: |
      Double-precision BLAS Level 1 scaled vector addition.
      Updates y in place with y = alpha * x + y for strided float64 vectors.
    for:
      - daxpy
    labels:
      - axpy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: caxpy
    description: |
      Single-precision complex BLAS Level 1 scaled vector addition.
      Updates y in place with y = alpha * x + y for strided complex64 vectors.
    for:
      - caxpy
    labels:
      - axpy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zaxpy
    description: |
      Double-precision complex BLAS Level 1 scaled vector addition.
      Updates y in place with y = alpha * x + y for strided complex128 vectors.
    for:
      - zaxpy
    labels:
      - axpy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: scopy
    description: |
      Single-precision BLAS Level 1 vector copy.
      Copies a strided float32 source vector x into a strided destination vector y.
    for:
      - scopy
    labels:
      - copy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dcopy
    description: |
      Double-precision BLAS Level 1 vector copy.
      Copies a strided float64 source vector x into a strided destination vector y.
    for:
      - dcopy
    labels:
      - copy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: ccopy
    description: |
      Single-precision complex BLAS Level 1 vector copy.
      Copies a strided complex64 source vector x into a strided destination vector y.
    for:
      - ccopy
    labels:
      - copy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zcopy
    description: |
      Double-precision complex BLAS Level 1 vector copy.
      Copies a strided complex128 source vector x into a strided destination vector y.
    for:
      - zcopy
    labels:
      - copy
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: sdot
    description: |
      Single-precision BLAS Level 1 dot-product reduction.
      Computes the dot product of strided float32 vectors x and y into a scalar result.
    for:
      - sdot
    labels:
      - dot
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: ddot
    description: |
      Double-precision BLAS Level 1 dot-product reduction.
      Computes the dot product of strided float64 vectors x and y into a scalar result.
    for:
      - ddot
    labels:
      - dot
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cdotu
    description: |
      Single-precision complex BLAS Level 1 unconjugated dot-product reduction.
      Computes the unconjugated dot product of strided complex64 vectors x and y.
    for:
      - cdotu
    labels:
      - dotu
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zdotu
    description: |
      Double-precision complex BLAS Level 1 unconjugated dot-product reduction.
      Computes the unconjugated dot product of strided complex128 vectors x and y.
    for:
      - zdotu
    labels:
      - dotu
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cdotc
    description: |
      Single-precision complex BLAS Level 1 conjugated dot-product reduction.
      Computes the conjugated dot product of strided complex64 vectors x and y.
    for:
      - cdotc
    labels:
      - dotc
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zdotc
    description: |
      Double-precision complex BLAS Level 1 conjugated dot-product reduction.
      Computes the conjugated dot product of strided complex128 vectors x and y.
    for:
      - zdotc
    labels:
      - dotc
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: sswap
    description: |
      Single-precision BLAS Level 1 vector swap.
      Swaps elements between strided float32 vectors x and y in place.
    for:
      - sswap
    labels:
      - swap
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dswap
    description: |
      Double-precision BLAS Level 1 vector swap.
      Swaps elements between strided float64 vectors x and y in place.
    for:
      - dswap
    labels:
      - swap
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cswap
    description: |
      Single-precision complex BLAS Level 1 vector swap.
      Swaps elements between strided complex64 vectors x and y in place.
    for:
      - cswap
    labels:
      - swap
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zswap
    description: |
      Double-precision complex BLAS Level 1 vector swap.
      Swaps elements between strided complex128 vectors x and y in place.
    for:
      - zswap
    labels:
      - swap
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: snrm2
    description: |
      Single-precision BLAS Level 1 Euclidean norm reduction.
      Computes sqrt(sum(x[i] ** 2)) for a strided float32 vector.
    for:
      - snrm2
    labels:
      - nrm2
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dnrm2
    description: |
      Double-precision BLAS Level 1 Euclidean norm reduction.
      Computes sqrt(sum(x[i] ** 2)) for a strided float64 vector.
    for:
      - dnrm2
    labels:
      - nrm2
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: scnrm2
    description: |
      Single-precision complex BLAS Level 1 Euclidean norm reduction.
      Computes sqrt(sum(abs(x[i]) ** 2)) for a strided complex64 vector.
    for:
      - scnrm2
    labels:
      - nrm2
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dznrm2
    description: |
      Double-precision complex BLAS Level 1 Euclidean norm reduction.
      Computes sqrt(sum(abs(x[i]) ** 2)) for a strided complex128 vector.
    for:
      - dznrm2
    labels:
      - nrm2
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: srot
    description: |
      Single-precision BLAS Level 1 plane rotation.
      Applies a Givens rotation to strided float32 vectors x and y in place.
    for:
      - srot
    labels:
      - rot
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: drot
    description: |
      Double-precision BLAS Level 1 plane rotation.
      Applies a Givens rotation to strided float64 vectors x and y in place.
    for:
      - drot
    labels:
      - rot
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: csrot
    description: |
      Single-precision complex BLAS Level 1 plane rotation.
      Applies a Givens rotation with real float32 c and s to strided complex64 vectors x and y in place.
    for:
      - csrot
    labels:
      - rot
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zdrot
    description: |
      Double-precision complex BLAS Level 1 plane rotation.
      Applies a Givens rotation with real float64 c and s to strided complex128 vectors x and y in place.
    for:
      - zdrot
    labels:
      - rot
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: srotg
    description: |
      Single-precision BLAS Level 1 Givens rotation parameter generation.
      Updates scalar float32 inputs a and b and writes float32 c and s.
    for:
      - srotg
    labels:
      - rotg
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: drotg
    description: |
      Double-precision BLAS Level 1 Givens rotation parameter generation.
      Updates scalar float64 inputs a and b and writes float64 c and s.
    for:
      - drotg
    labels:
      - rotg
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: crotg
    description: |
      Single-precision complex BLAS Level 1 Givens rotation parameter generation.
      Updates scalar complex64 input a and writes real float32 c plus complex64 s.
    for:
      - crotg
    labels:
      - rotg
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zrotg
    description: |
      Double-precision complex BLAS Level 1 Givens rotation parameter generation.
      Updates scalar complex128 input a and writes real float64 c plus complex128 s.
    for:
      - zrotg
    labels:
      - rotg
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: srotm
    description: |
      Single-precision BLAS Level 1 modified Givens rotation.
      Applies param-controlled modified rotation to strided float32 vectors x and y.
    for:
      - srotm
    labels:
      - rotm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: drotm
    description: |
      Double-precision BLAS Level 1 modified Givens rotation.
      Applies param-controlled modified rotation to strided float64 vectors x and y.
    for:
      - drotm
    labels:
      - rotm
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: srotmg
    description: |
      Single-precision BLAS Level 1 modified Givens rotation parameter generation.
      Updates scalar float32 d1, d2, x1 and writes the length-5 float32 param vector.
    for:
      - srotmg
    labels:
      - rotmg
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: drotmg
    description: |
      Double-precision BLAS Level 1 modified Givens rotation parameter generation.
      Updates scalar float64 d1, d2, x1 and writes the length-5 float64 param vector.
    for:
      - drotmg
    labels:
      - rotmg
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: sscal
    description: |
      Single-precision BLAS Level 1 vector scaling.
      Updates a strided float32 vector in place with x = alpha * x.
    for:
      - sscal
    labels:
      - scal
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dscal
    description: |
      Double-precision BLAS Level 1 vector scaling.
      Updates a strided float64 vector in place with x = alpha * x.
    for:
      - dscal
    labels:
      - scal
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cscal
    description: |
      Single-precision complex BLAS Level 1 vector scaling.
      Updates a strided complex64 vector in place with x = alpha * x using a complex scalar.
    for:
      - cscal
    labels:
      - scal
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zscal
    description: |
      Double-precision complex BLAS Level 1 vector scaling.
      Updates a strided complex128 vector in place with x = alpha * x using a complex scalar.
    for:
      - zscal
    labels:
      - scal
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: csscal
    description: |
      Single-precision complex BLAS Level 1 vector scaling by a real scalar.
      Updates a strided complex64 vector in place with x = alpha * x using a float32 scalar.
    for:
      - csscal
    labels:
      - scal
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zdscal
    description: |
      Double-precision complex BLAS Level 1 vector scaling by a real scalar.
      Updates a strided complex128 vector in place with x = alpha * x using a float64 scalar.
    for:
      - zdscal
    labels:
      - scal
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: sgemv
    description: |
      Single-precision BLAS Level 2 general matrix-vector multiplication.
      Computes y = alpha * op(A) * x + beta * y for a float32 dense matrix A.
    for:
      - sgemv
    labels:
      - gemv
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: sger
    description: |
      Single-precision BLAS Level 2 general rank-1 update.
      Updates A in place with A = alpha * x * y^T + A for a float32 dense matrix A.
    for:
      - sger
    labels:
      - ger
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dger
    description: |
      Double-precision BLAS Level 2 general rank-1 update.
      Updates A in place with A = alpha * x * y^T + A for a float64 dense matrix A.
    for:
      - dger
    labels:
      - ger
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cgeru
    description: |
      Single-precision complex BLAS Level 2 unconjugated general rank-1 update.
      Updates A in place with A = alpha * x * y^T + A for a complex64 dense matrix A.
    for:
      - cgeru
    labels:
      - ger
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cgerc
    description: |
      Single-precision complex BLAS Level 2 conjugated general rank-1 update.
      Updates A in place with A = alpha * x * conj(y)^T + A for a complex64 dense matrix A.
    for:
      - cgerc
    labels:
      - ger
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zgeru
    description: |
      Double-precision complex BLAS Level 2 unconjugated general rank-1 update.
      Updates A in place with A = alpha * x * y^T + A for a complex128 dense matrix A.
    for:
      - zgeru
    labels:
      - ger
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zgerc
    description: |
      Double-precision complex BLAS Level 2 conjugated general rank-1 update.
      Updates A in place with A = alpha * x * conj(y)^T + A for a complex128 dense matrix A.
    for:
      - zgerc
    labels:
      - ger
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: dgemv
    description: |
      Double-precision BLAS Level 2 general matrix-vector multiplication.
      Computes y = alpha * op(A) * x + beta * y for a float64 dense matrix A.
    for:
      - dgemv
    labels:
      - gemv
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: cgemv
    description: |
      Single-precision complex BLAS Level 2 general matrix-vector multiplication.
      Computes y = alpha * op(A) * x + beta * y for a complex64 dense matrix A.
    for:
      - cgemv
    labels:
      - gemv
    kind:
      - BLAS
    stages:
      - stable: '0.1'
  - id: zgemv
    description: |
      Double-precision complex BLAS Level 2 general matrix-vector multiplication.
      Computes y = alpha * op(A) * x + beta * y for a complex128 dense matrix A.
    for:
      - zgemv
    labels:
      - gemv
    kind:
      - BLAS
    stages:
      - stable: '0.1'
