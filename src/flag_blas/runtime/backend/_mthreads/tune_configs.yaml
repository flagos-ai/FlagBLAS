# Tuned configurations for the MThreads (MUSA) platform.
# The sgemm entry drives the FMA-style kernel in _mthreads/ops/sgemm.py.
# The tile configs match the ones FlagGems tunes for its MThreads mm kernel.
sgemm:
  - META: {BLOCK_M: 64, BLOCK_N: 64, BLOCK_K: 64, GROUP_M: 8}
    num_warps: 4
    num_stages: 5
  - META: {BLOCK_M: 64, BLOCK_N: 64, BLOCK_K: 64, GROUP_M: 8}
    num_warps: 4
    num_stages: 4
