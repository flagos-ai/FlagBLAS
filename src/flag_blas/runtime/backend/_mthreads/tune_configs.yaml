# Conservative Level 2 launch configurations validated with Triton-MUSA.
sgemv_n:
  - META: {BLOCK_SIZE_M: 32, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 2
sgemv_t:
  - META: {BLOCK_SIZE_M: 32, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 2
sgemv_n_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1
sgemv_t_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1
cgemv_n:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 2
cgemv:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 2
cgemv_n_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1
cgemv_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1
hgemv_n:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 2
hgemv_t:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 1}
    num_warps: 1
    num_stages: 2
hgemv_n_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1
hgemv_t_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1
bfgemv_n:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 2
bfgemv_t:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 1}
    num_warps: 1
    num_stages: 2
bfgemv_n_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1
bfgemv_t_splitk:
  - META: {BLOCK_SIZE_M: 16, BLOCK_SIZE_K: 32}
    num_warps: 1
    num_stages: 1

# Triton-MUSA miscompiles the shared 64 x 64 complex reduction candidate for
# large CTRMV inputs. These four candidates are numerically stable on MUSA.
ctrmv:
  - META: {BLOCK_SIZE_M: 32, BLOCK_K: 16}
    num_warps: 2
    num_stages: 1
  - META: {BLOCK_SIZE_M: 32, BLOCK_K: 32}
    num_warps: 2
    num_stages: 2
  - META: {BLOCK_SIZE_M: 64, BLOCK_K: 32}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_SIZE_M: 128, BLOCK_K: 32}
    num_warps: 8
    num_stages: 2
