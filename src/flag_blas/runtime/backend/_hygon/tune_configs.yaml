  # 2048^3 NN main 仅 ~77TF。此处 = NVIDIA 原 9 config (保 TT 变体不回归, 超集) +
  # 实测 hygon 优胜 config (BK=32/64, s2, w4-16; 2048^3 main 222.6->167us -25%,
