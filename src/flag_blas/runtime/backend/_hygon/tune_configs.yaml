# bfgemm_nt: Hygon gfx936 bfgemm NT 直接内核 pool。此前 hygon 无 bfgemm_nt 段,
# 回落到 NVIDIA 缺省池 (BK128/s3-6 在 gfx936 smem 上限外大量 shape 只选到次优
# 小 tile), v4 官跑 NT 大方形仅 8192^3 7.18ms (sp 0.50)、16384^3 55.9ms (sp 0.93)。
# NT 与 NN 同源通用 level3 内核 (仅 B tile 读法不同: transb=T 时 B 物理 (n,k)),
# 直接共享 bfgemm_nn 池 (27 configs)。2026-09-05 官方协议 (do_bench w1000/r100/
# median) 逐 shape 验证: (256,256,BK64,w16,s2) 8192^3 -> 4.10ms (sp 0.87)、
# 16384^3 -> 32.8ms (sp 1.59)、4096x24576x8192 -> 6.30ms (sp 1.66)、8191^3 -> 9.45ms
# (sp 0.54) 等, 输出与旧池逐位一致; 小 shape 由 autotune 选小 tile config, 无回退。
bfgemm_nt: *bfgemm_nn_hygon_configs

# bfgemm_tn: Hygon gfx936 bfgemm TN 直接内核 pool。此前 hygon 无 bfgemm_tn 段,
# 回落到 NVIDIA 缺省池 (仅 4 config: (64,32,BK128,w8,s5)/(64,64,BK64,w4,s4)/
# (128,128,BK64,w8,s6)/(128,128,BK64,w8,s3); s5/s6 超出 gfx936 64KB smem 编译失败,
# 实际可用 ~1-2 个), TN shape 大量只能选到次优 tile (v7 TN 8192^3 仅 0.516 sp 而
# NN 同 shape 0.595, 且 2048 级小 shape 全低于 NN 对应档)。TN 与 NN/NT 同源通用
# level3 内核 (仅 A tile 读法不同: transa=T 时 A 物理 (k,m)), 直接共享 bfgemm_nn 池;
# libtuner 每 shape 从并集自选最优, 池扩大无回归风险 (只增选择)。
bfgemm_tn: *bfgemm_nn_hygon_configs

# hgemm_nn / hgemm_nt / hgemm_tn: Hygon gfx936 hgemm 专用池。
# 此前 hygon 无 hgemm_* 段, 回落 NVIDIA 缺省池, TN/TT 变体绝对吞吐偏低
# (hgemm 报告 2026-09-03: 8192^3 tn ~62 / tt ~76 TFLOPS, nn 105 / nt 154)。
# hgemm 与 bfgemm 同为 2B dtype、共用同一套通用 level3 内核与 gfx936 资源约束
# (smem/VGPR), 故初始池直接复用 bfgemm_*_hygon 池 (该池含 NVIDIA 原 9 config
# 作为超集, libtuner 每 shape 自选最优, 相对缺省池无回退风险)。后续可在真机按
# fp16 专项扫描增补/收敛。
hgemm_nn: *bfgemm_nn_hygon_configs
hgemm_nt: *bfgemm_nn_hygon_configs
hgemm_tn: *bfgemm_nn_hygon_configs
