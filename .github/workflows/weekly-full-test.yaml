name: Weekly Full Test

on:
  schedule:
    # 每周一 19:35 Asia/Shanghai (UTC+8) = 周一 11:35 UTC
    - cron: '35 11 * * 1'
  workflow_dispatch:

jobs:
  test-nvidia:
    uses: ./.github/workflows/backend-test.yaml
    with:
      vendor: 'nvidia'
      runner_label: 'h100'
      gpu_check_script: 'tools/check_nvidia_gpu.sh'
      changed_files: '__ALL__'
      pr_id: 'weekly'
