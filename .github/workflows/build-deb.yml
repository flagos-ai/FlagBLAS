name: Build Debian Packages

# Verifies that the packaging definition still builds and installs. It is
# not a release path: packages published to the FlagOS repositories are
# built and uploaded by flagos-ai/build-infra from a pinned ref, so no tag
# triggers a build here.
on:
  pull_request:
    branches: [master]
    # Only what changes the package: a package built on a source PR is
    # published nowhere.
    paths:
      - 'packaging/debian/**'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build .deb
        run: bash packaging/debian/build-helpers/build-flag-blas.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flag-blas-amd64-packages
          path: debian-packages/*.deb
          retention-days: 7
