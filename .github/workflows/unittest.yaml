name: CI Auto Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
      pr_id: ${{ steps.get-pr-id.outputs.PR_ID }}
      labels: ${{ fromJSON(steps.get-labels.outputs.result) }}
    steps:
      - id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
      - uses: actions/checkout@v4

      - id: wait-for-triage
        if: github.event_name == 'pull_request'
        uses: ArcticLampyrid/action-wait-for-workflow@v1
        with:
          workflow: .github/workflows/triage.yaml
        continue-on-error: true

      - id: get-pr-id
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_ID=${{ github.event.pull_request.number }}
          elif [ "${{ github.event_name }}" == "push" ]; then
            PR_NUMBER=$(git log -1 --pretty=format:'%s' | grep -oE '#[0-9]+' | grep -oE '[0-9]+')
            PR_ID=${PR_NUMBER}
          fi
          echo "PR_ID=${PR_ID}" >> "$GITHUB_OUTPUT"
          echo "PR_ID: ${PR_ID}"

      - id: get-labels
        uses: actions/github-script@v7
        with:
          script: |
            // Determine if the event is a pull request
            const isPullRequest = context.eventName === 'pull_request';
            if (!isPullRequest) {
              return "[]";
            }

            const prNumber = context.payload.pull_request.number;
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const labelNames = labels.map(label => label.name);
            console.log('Labels:', labelNames);
            return JSON.stringify(labelNames);

  test-nvidia:
    needs: preprocess
    # Always run on workflow_dispatch or push to master.
    # On PR, only run when the 'tests' or 'vendor/NVIDIA' label is present.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(needs.preprocess.outputs.labels, 'tests') ||
      contains(needs.preprocess.outputs.labels, 'ops') ||
      contains(needs.preprocess.outputs.labels, 'core') ||
      contains(needs.preprocess.outputs.labels, 'benchmark') ||
      contains(needs.preprocess.outputs.labels, 'vendor/NVIDIA')
    uses: ./.github/workflows/backend-test.yaml
    with:
      vendor: 'nvidia'
      runner_label: 'h100'
      gpu_check_script: 'tools/check_nvidia_gpu.sh'
      pr_id: ${{ needs.preprocess.outputs.pr_id }}
      changed_files: ${{ join(needs.preprocess.outputs.changed_files, ' ') }}

  test-ascend:
    needs: preprocess
    # Always run on workflow_dispatch or push to master.
    # On PR, only run when the 'tests' or 'vendor/Ascend' label is present.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(needs.preprocess.outputs.labels, 'tests') ||
      contains(needs.preprocess.outputs.labels, 'ops') ||
      contains(needs.preprocess.outputs.labels, 'core') ||
      contains(needs.preprocess.outputs.labels, 'benchmark') ||
      contains(needs.preprocess.outputs.labels, 'vendor/Ascend')
    uses: ./.github/workflows/backend-test.yaml
    with:
      vendor: 'ascend'
      runner_label: 'cann9'
      gpu_check_script: 'tools/check_ascend_gpu.sh'
      pr_id: ${{ needs.preprocess.outputs.pr_id }}
      changed_files: ${{ join(needs.preprocess.outputs.changed_files, ' ') }}

  test-hygon:
    needs: preprocess
    # Always run on workflow_dispatch or push to master.
    # On PR, only run when the 'tests' or 'vendor/Hygon' label is present.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(needs.preprocess.outputs.labels, 'tests') ||
      contains(needs.preprocess.outputs.labels, 'ops') ||
      contains(needs.preprocess.outputs.labels, 'core') ||
      contains(needs.preprocess.outputs.labels, 'benchmark') ||
      contains(needs.preprocess.outputs.labels, 'vendor/Hygon')
    uses: ./.github/workflows/backend-test.yaml
    with:
      vendor: 'hygon'
      runner_label: 'hygon'
      gpu_check_script: 'tools/check_hygon_gpu.sh'
      pr_id: ${{ needs.preprocess.outputs.pr_id }}
      changed_files: ${{ join(needs.preprocess.outputs.changed_files, ' ') }}

  test-iluvatar:
    needs: preprocess
    # Always run on workflow_dispatch or push to master.
    # On PR, only run when the 'tests' or 'vendor/Iluvatar' label is present.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      contains(needs.preprocess.outputs.labels, 'tests') ||
      contains(needs.preprocess.outputs.labels, 'ops') ||
      contains(needs.preprocess.outputs.labels, 'core') ||
      contains(needs.preprocess.outputs.labels, 'benchmark') ||
      contains(needs.preprocess.outputs.labels, 'vendor/Iluvatar')
    uses: ./.github/workflows/backend-test.yaml
    with:
      vendor: 'iluvatar'
      # Pin to the BI-V150 (corex 4.4.0) self-hosted runner. The generic
      # 'iluvatar' label is shared by three machines -- iluvatar-n15
      # (corex440), iluvatar-n23 (corex450) and iluvatar-n87 (no corex tag) --
      # so the job could land on a host without the corex 4.4.0 runtime.
      # 'corex440' is only registered on the BI-V150 machine (iluvatar-n15).
      runner_label: 'corex440'
      gpu_check_script: 'tools/check_iluvatar_gpu.sh'
      pr_id: ${{ needs.preprocess.outputs.pr_id }}
      changed_files: ${{ join(needs.preprocess.outputs.changed_files, ' ') }}
